<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Generator Link Tamu
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #0f5132,
                    #198754
                );
            color: #222;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        .header {
            color: #fff;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .header p {
            margin: 0;
            opacity: .85;
            font-size: 13px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 20px 50px
                rgba(0,0,0,.15);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="url"],
        input[type="file"] {
            width: 100%;
            padding: 13px;
            border:
                1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #198754;
            box-shadow:
                0 0 0 3px
                rgba(25,135,84,.1);
        }

        .button {
            border: 0;
            border-radius: 12px;
            padding: 12px 17px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .button:hover {
            transform:
                translateY(-2px);
        }

        .button:active {
            transform:
                scale(.97);
        }

        .button-primary {
            background: #198754;
            color: #fff;
        }

        .button-secondary {
            background: #eee;
            color: #222;
        }

        .button-whatsapp {
            background: #25D366;
            color: #fff;
        }

        .button-danger {
            background: #dc3545;
            color: #fff;
        }

        .button-blue {
            background: #0d6efd;
            color: #fff;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .notice {
            background: #fff3cd;
            color: #664d03;
            padding: 13px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 23px;
            font-weight: 800;
            color: #198754;
        }

        .stat-label {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: #666;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th,
        td {
            padding:
                11px 10px;
            border-bottom:
                1px solid #eee;
            text-align: left;
            vertical-align: top;
            font-size: 12px;
        }

        th {
            background: #f7f7f7;
            font-size: 12px;
        }

        .link-box {
            max-width: 300px;
            word-break: break-all;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            font-size: 10px;
            line-height: 1.5;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #777;
        }

        .file-name {
            display: block;
            margin-top: 7px;
            color: #666;
            font-size: 11px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform:
                translate(-50%, 30px);
            background:
                rgba(20,20,20,.95);
            color: #fff;
            padding:
                12px 18px;
            border-radius: 12px;
            font-size: 12px;
            opacity: 0;
            visibility: hidden;
            transition: .3s ease;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform:
                translate(-50%, 0);
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 15px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 21px;
            }

            .stats {
                grid-template-columns:
                    1fr 1fr;
            }

            .stats .stat:last-child {
                grid-column:
                    span 2;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <header class="header">

        <h1>
            💌 Generator Link Tamu
        </h1>

        <p>
            PROJECT MASTER — UNDANGAN DIGITAL PREMIUM
        </p>

    </header>


    <!-- =================================================
         KONFIGURASI
         ================================================= -->

    <div class="card">

        <div class="form-group">

            <label>
                URL Undangan GitHub Pages
            </label>

            <input
                id="baseUrl"
                type="url"
                placeholder="https://username.github.io/repository/">

        </div>


        <div class="notice">

            Contoh:

            <br>

            <strong>
                https://username.github.io/PROJECT-MASTER-UNDANGAN-DIGITAL-PREMIUM/
            </strong>

            <br><br>

            URL ini akan menjadi dasar seluruh
            link personal tamu.

        </div>


        <div class="form-group">

            <label>
                Import Daftar Tamu
            </label>

            <input
                id="csvFile"
                type="file"
                accept=".csv,text/csv">

            <span
                id="fileName"
                class="file-name">
            </span>

        </div>


        <div class="actions">

            <button
                class="button button-primary"
                onclick="importCSV()">

                📂 Import CSV

            </button>


            <button
                class="button button-blue"
                onclick="generateLinks()">

                🔗 Generate Link

            </button>


            <button
                class="button button-secondary"
                onclick="copyAllLinks()">

                📋 Salin Semua

            </button>


            <button
                class="button button-secondary"
                onclick="exportCSV()">

                ⬇️ Export CSV

            </button>

        </div>

    </div>


    <!-- =================================================
         STATISTIK
         ================================================= -->

    <div class="card">

        <div class="stats">

            <div class="stat">

                <span
                    id="totalGuest"
                    class="stat-number">
                    0
                </span>

                <span class="stat-label">
                    Total Tamu
                </span>

            </div>


            <div class="stat">

                <span
                    id="totalGenerated"
                    class="stat-number">
                    0
                </span>

                <span class="stat-label">
                    Link Dibuat
                </span>

            </div>


            <div class="stat">

                <span
                    id="totalWhatsApp"
                    class="stat-number">
                    0
                </span>

                <span class="stat-label">
                    Nomor WhatsApp
                </span>

            </div>

        </div>


        <div class="search-box">

            <input
                id="searchGuest"
                type="text"
                placeholder="🔍 Cari nama tamu..."
                oninput="renderTable()">

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            Nama Tamu
                        </th>

                        <th>
                            WhatsApp
                        </th>

                        <th>
                            Keterangan
                        </th>

                        <th>
                            Link Personal
                        </th>

                        <th>
                            Aksi
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="guestTable">

                </tbody>

            </table>

        </div>

    </div>


</div>


<div
    id="toast"
    class="toast">
</div>


<script>

"use strict";


/* =====================================================
   DATA
   ===================================================== */

let guests = [];


/* =====================================================
   INITIALIZE
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadSettings();

        updateStats();

    }
);


/* =====================================================
   LOAD SETTINGS
   ===================================================== */

function loadSettings() {

    const baseUrl =
        localStorage.getItem(
            "invitation_base_url"
        );


    if (
        baseUrl
    ) {

        document
            .getElementById(
                "baseUrl"
            )
            .value =
            baseUrl;

    }

}


/* =====================================================
   IMPORT CSV
   ===================================================== */

function importCSV() {

    const input =
        document.getElementById(
            "csvFile"
        );


    if (
        !input.files ||
        !input.files.length
    ) {

        showToast(
            "Pilih file daftar-tamu.csv terlebih dahulu."
        );

        return;

    }


    const file =
        input.files[0];


    document
        .getElementById(
            "fileName"
        )
        .textContent =
        `File: ${file.name}`;


    const reader =
        new FileReader();


    reader.onload =
        function (
            event
        ) {

            try {

                const text =
                    event.target.result;


                const rows =
                    parseCSV(
                        text
                    );


                if (
                    rows.length < 2
                ) {

                    throw new Error(
                        "CSV tidak memiliki data tamu."
                    );

                }


                const headers =
                    rows[0].map(
                        normalizeHeader
                    );


                const noIndex =
                    findHeader(
                        headers,
                        [
                            "no",
                            "nomor"
                        ]
                    );


                const nameIndex =
                    findHeader(
                        headers,
                        [
                            "nama",
                            "namatamu",
                            "tamu"
                        ]
                    );


                const whatsappIndex =
                    findHeader(
                        headers,
                        [
                            "whatsapp",
                            "wa",
                            "nomorwhatsapp",
                            "nohp",
                            "telepon"
                        ]
                    );


                const descriptionIndex =
                    findHeader(
                        headers,
                        [
                            "keterangan",
                            "kategori",
                            "catatan"
                        ]
                    );


                if (
                    nameIndex === -1
                ) {

                    throw new Error(
                        "Kolom 'nama' tidak ditemukan."
                    );

                }


                guests =
                    rows
                        .slice(1)
                        .filter(
                            function (
                                row
                            ) {

                                return row.some(
                                    function (
                                        value
                                    ) {

                                        return String(
                                            value || ""
                                        ).trim();

                                    }
                                );

                            }
                        )
                        .map(
                            function (
                                row,
                                index
                            ) {

                                return {

                                    no:
                                        getValue(
                                            row,
                                            noIndex
                                        ) ||
                                        index + 1,

                                    name:
                                        getValue(
                                            row,
                                            nameIndex
                                        ),

                                    whatsapp:
                                        getValue(
                                            row,
                                            whatsappIndex
                                        ),

                                    description:
                                        getValue(
                                            row,
                                            descriptionIndex
                                        ),

                                    link:
                                        ""

                                };

                            }
                        );


                renderTable();

                updateStats();


                showToast(
                    `${guests.length} tamu berhasil diimport.`
                );

            } catch (
                error
            ) {

                console.error(
                    error
                );

                showToast(
                    error.message ||
                    "CSV gagal dibaca."
                );

            }

        };


    reader.onerror =
        function () {

            showToast(
                "File gagal dibaca."
            );

        };


    reader.readAsText(
        file,
        "UTF-8"
    );

}


/* =====================================================
   CSV PARSER
   ===================================================== */

function parseCSV(
    text
) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === ',' &&
            !insideQuotes
        ) {

            row.push(
                value.trim()
            );

            value = "";

            continue;

        }


        if (
            (
                char === '\n' ||
                char === '\r'
            ) &&
            !insideQuotes
        ) {

            if (
                char === '\r' &&
                next === '\n'
            ) {

                i++;

            }


            row.push(
                value.trim()
            );

            rows.push(
                row
            );

            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value.length ||
        row.length
    ) {

        row.push(
            value.trim()
        );

        rows.push(
            row
        );

    }


    return rows;

}


/* =====================================================
   NORMALIZE HEADER
   ===================================================== */

function normalizeHeader(
    value
) {

    return String(
        value || ""
    )
        .toLowerCase()
        .trim()
        .replace(
            /[\s_-]/g,
            ""
        );

}


/* =====================================================
   FIND HEADER
   ===================================================== */

function findHeader(
    headers,
    candidates
) {

    for (
        const candidate
        of candidates
    ) {

        const index =
            headers.indexOf(
                candidate
            );


        if (
            index !== -1
        ) {

            return index;

        }

    }


    return -1;

}


/* =====================================================
   GET VALUE
   ===================================================== */

function getValue(
    row,
    index
) {

    if (
        index === -1 ||
        index === undefined
    ) {

        return "";

    }


    return String(
        row[index] || ""
    ).trim();

}


/* =====================================================
   GENERATE LINKS
   ===================================================== */

function generateLinks() {

    const input =
        document
            .getElementById(
                "baseUrl"
            );


    const baseUrl =
        input.value.trim();


    if (
        !baseUrl
    ) {

        showToast(
            "Masukkan URL undangan terlebih dahulu."
        );

        input.focus();

        return;

    }


    try {

        new URL(
            baseUrl
        );

    } catch (
        error
    ) {

        showToast(
            "URL undangan tidak valid."
        );

        return;

    }


    if (
        !guests.length
    ) {

        showToast(
            "Import daftar tamu terlebih dahulu."
        );

        return;

    }


    localStorage.setItem(
        "invitation_base_url",
        baseUrl
    );


    guests.forEach(
        function (
            guest
        ) {

            if (
                !guest.name
            ) {

                guest.link =
                    "";

                return;

            }


            const url =
                new URL(
                    baseUrl
                );


            url.searchParams.set(
                "kpd",
                guest.name
            );


            guest.link =
                url.toString();

        }
    );


    renderTable();

    updateStats();


    showToast(
        `${guests.length} link personal berhasil dibuat.`
    );

}


/* =====================================================
   RENDER TABLE
   ===================================================== */

function renderTable() {

    const tbody =
        document
            .getElementById(
                "guestTable"
            );


    const search =
        document
            .getElementById(
                "searchGuest"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        guests.filter(
            function (
                guest
            ) {

                return (

                    !search ||

                    guest.name
                        .toLowerCase()
                        .includes(
                            search
                        ) ||

                    guest.whatsapp
                        .toLowerCase()
                        .includes(
                            search
                        ) ||

                    guest.description
                        .toLowerCase()
                        .includes(
                            search
                        )

                );

            }
        );


    if (
        !filtered.length
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    ${
                        guests.length
                        ? "Tamu tidak ditemukan."
                        : "Belum ada data tamu."
                    }

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML = "";


    filtered.forEach(
        function (
            guest
        ) {

            const realIndex =
                guests.indexOf(
                    guest
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    ${escapeHTML(
                        guest.no
                    )}
                </td>


                <td>

                    <strong>
                        ${escapeHTML(
                            guest.name
                        )}
                    </strong>

                </td>


                <td>
                    ${escapeHTML(
                        guest.whatsapp ||
                        "-"
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        guest.description ||
                        "-"
                    )}
                </td>


                <td>

                    <div
                        class="link-box">

                        ${
                            guest.link
                            ?
                            escapeHTML(
                                guest.link
                            )
                            :
                            "Belum dibuat"
                        }

                    </div>

                </td>


                <td>

                    <div class="actions">

                        <button
                            class="button button-whatsapp"
                            onclick="sendWhatsApp(
                                ${realIndex}
                            )">

                            💬 WA

                        </button>


                        <button
                            class="button button-secondary"
                            onclick="copyLink(
                                ${realIndex}
                            )">

                            🔗 Salin

                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =====================================================
   COPY LINK
   ===================================================== */

async function copyLink(
    index
) {

    const guest =
        guests[index];


    if (
        !guest ||
        !guest.link
    ) {

        showToast(
            "Generate link terlebih dahulu."
        );

        return;

    }


    const success =
        await copyText(
            guest.link
        );


    if (
        success
    ) {

        showToast(
            `Link ${guest.name} berhasil disalin.`
        );

    } else {

        showToast(
            "Link gagal disalin."
        );

    }

}


/* =====================================================
   COPY ALL LINKS
   ===================================================== */

async function copyAllLinks() {

    const generated =
        guests.filter(
            function (
                guest
            ) {

                return guest.link;

            }
        );


    if (
        !generated.length
    ) {

        showToast(
            "Belum ada link yang dibuat."
        );

        return;

    }


    const text =
        generated
            .map(
                function (
                    guest,
                    index
                ) {

                    return (
                        `${index + 1}. ` +
                        `${guest.name}\n` +
                        `${guest.link}`
                    );

                }
            )
            .join(
                "\n\n"
            );


    const success =
        await copyText(
            text
        );


    if (
        success
    ) {

        showToast(
            `${generated.length} link berhasil disalin.`
        );

    }

}


/* =====================================================
   WHATSAPP
   ===================================================== */

function sendWhatsApp(
    index
) {

    const guest =
        guests[index];


    if (
        !guest
    ) {

        return;

    }


    if (
        !guest.link
    ) {

        showToast(
            "Generate link terlebih dahulu."
        );

        return;

    }


    let phone =
        String(
            guest.whatsapp || ""
        )
        .replace(
            /[^0-9]/g,
            ""
        );


    if (
        phone.startsWith(
            "08"
        )
    ) {

        phone =
            "62" +
            phone.substring(
                1
            );

    }


    if (
        !phone
    ) {

        showToast(
            `Nomor WhatsApp ${guest.name} belum tersedia.`
        );

        return;

    }


    const message =

`Assalamu'alaikum Wr. Wb.

Kepada Yth.
${guest.name}

Dengan penuh kebahagiaan, kami mengundang Anda untuk hadir dalam acara pernikahan:

💍 Sri Hartina A. Maatiala & Baharudin M. Jakaria

Silakan buka undangan digital kami melalui link berikut:

${guest.link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Anda berkenan hadir.

Terima kasih atas doa dan restunya.

Wassalamu'alaikum Wr. Wb.`;


    const url =
        `https://wa.me/${phone}?text=${
            encodeURIComponent(
                message
            )
        }`;


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =====================================================
   EXPORT CSV
   ===================================================== */

function exportCSV() {

    if (
        !guests.length
    ) {

        showToast(
            "Belum ada data tamu."
        );

        return;

    }


    const header =
        [
            "no",
            "nama",
            "whatsapp",
            "keterangan",
            "link_personal"
        ];


    const rows =
        guests.map(
            function (
                guest
            ) {

                return [

                    guest.no,

                    guest.name,

                    guest.whatsapp,

                    guest.description,

                    guest.link

                ];

            }
        );


    const csv =
        [
            header,
            ...rows
        ]
        .map(
            function (
                row
            ) {

                return row
                    .map(
                        csvEscape
                    )
                    .join(",");

            }
        )
        .join("\r\n");


    const blob =
        new Blob(
            [
                "\uFEFF" +
                csv
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "hasil-link-tamu.csv";


    document.body.appendChild(
        a
    );


    a.click();


    document.body.removeChild(
        a
    );


    URL.revokeObjectURL(
        url
    );


    showToast(
        "File hasil berhasil dibuat."
    );

}


/* =====================================================
   CSV ESCAPE
   ===================================================== */

function csvEscape(
    value
) {

    const text =
        String(
            value ?? ""
        );


    return (
        '"' +
        text
            .replace(
                /"/g,
                '""'
            ) +
        '"'
    );

}


/* =====================================================
   COPY TEXT
   ===================================================== */

async function copyText(
    text
) {

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        try {

            await navigator.clipboard
                .writeText(
                    text
                );

            return true;

        } catch (
            error
        ) {

            console.warn(
                error
            );

        }

    }


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";


    textarea.style.left =
        "-9999px";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    let success =
        false;


    try {

        success =
            document.execCommand(
                "copy"
            );

    } catch (
        error
    ) {

        console.warn(
            error
        );

    }


    document.body.removeChild(
        textarea
    );


    return success;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

        )

            }
        ).length;

/* =====================================================
   TOAST
   ===================================================== */

let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}
